name: Проверка сайта

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить сайт и защиту платного контента
        run: node --test scripts/*.test.mjs
      - name: Собрать переносимую статическую версию
        run: node scripts/build-static.mjs
      - name: Проверить наличие готовых файлов
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
